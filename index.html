<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shakti Singh | Portfolio</title>

    <link 
      rel="stylesheet" 
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" 
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" 
      crossorigin="anonymous" 
      referrerpolicy="no-referrer" 
    />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

    <style>
      /* --- GLOBAL BASE STYLES --- */
      html {
        scroll-behavior: smooth;
        background-color: #020617; /* Slate-950 */
        overflow-x: hidden; /* Stops horizontal shaking during animations */
      }
      
      body {
        font-family: 'Inter', sans-serif;
        margin: 0;
        padding: 0;
        color: #f8fafc;
        overflow-x: hidden;
      }

      /* --- SELECTION (Premium Branding) --- */
      ::selection {
        background-color: rgba(79, 70, 229, 0.3); /* Indigo Glow */
        color: #ffffff;
      }

      /* --- FUTURISTIC SCROLLBAR --- */
      ::-webkit-scrollbar {
        width: 6px; /* Slimmer look */
      }
      ::-webkit-scrollbar-track {
        background: #020617;
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(to bottom, #1e293b, #4f46e5); /* Indigo gradient */
        border-radius: 20px;
        border: 2px solid #020617; /* Creates a floating effect */
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #6366f1;
      }

      /* --- PREVENT LAYOUT SHIFT --- */
      #root {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
